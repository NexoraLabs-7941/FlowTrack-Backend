#Spring Boot Application Name
spring.application.name=flowtrack-backend

#Spring Boot Application Configuration
spring.datasource.url=jdbc:postgresql://ep-aged-moon-ap5mshiz-pooler.c-7.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_oznFj6P4xKMX
spring.datasource.driver-class-name=org.postgresql.Driver

#Spring Boot JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.hibernate.naming.physical-strategy=com.nexoralabs.flowtrack.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

#OpenAPI Documentation Configuration
documentation.application.description=Flowtrack Backend API - Sistema de gestion de inventario
documentation.application.version=1.0.0


