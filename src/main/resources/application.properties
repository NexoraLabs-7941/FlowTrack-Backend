
spring.profiles.active=dev
#Spring Boot Application Name
spring.application.name=flowtrack-backend

#Spring Boot Application Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:flowtrack}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:fabs}
spring.datasource.driver-class-name=org.postgresql.Driver
#Spring Boot JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.hibernate.naming.physical-strategy=com.nexoralabs.flowtrack.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

#OpenAPI Documentation Configuration
documentation.application.description=Flowtrack Backend API - Sistema de gestion de inventario
documentation.application.version=1.0.0


# JWT Configuration Properties-

# Custom Properties for JWT
# suppress inspection "SpringBootApplicationProperties"
authorization.jwt.secret = ${JWT_SECRET:WriteHereYourSecretStringForTokenSigningCredentials}
# suppress inspection "SpringBootApplicationProperties"
authorization.jwt.expiration.days = ${JWT_EXP_DAYS:7}

server.port=${PORT:8081}

# Edge Vision (Python) - URLs consumidas por el orquestador Java

edge.vision.start-url= https://shaded-nativity-travel.ngrok-free.dev/api/v1/vision/start
edge.vision.stop-url= https://shaded-nativity-travel.ngrok-free.dev/api/v1/vision/stop
edge.vision.detect-image-url=https://shaded-nativity-travel.ngrok-free.dev/api/v1/vision/detect-image

