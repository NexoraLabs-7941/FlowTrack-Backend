
spring.profiles.active=dev
#Spring Boot Application Name
spring.application.name=flowtrack-backend

#Spring Boot Application Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:flowtrack}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:fabs}
spring.datasource.driver-class-name=org.postgresql.Driver
#Spring Boot JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.hibernate.naming.physical-strategy=com.nexoralabs.flowtrack.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

#OpenAPI Documentation Configuration
documentation.application.description=Flowtrack Backend API - Sistema de gestion de inventario
documentation.application.version=1.0.0


# JWT Configuration Properties

# Custom Properties for JWT
# suppress inspection "SpringBootApplicationProperties"
authorization.jwt.secret = WriteHereYourSecretStringForTokenSigningCredentials
# suppress inspection "SpringBootApplicationProperties"
authorization.jwt.expiration.days = 7

server.port=${PORT:8081}

# Edge Vision (Python) - URLs consumidas por el orquestador Java
edge.vision.start-url=${EDGE_VISION_START_URL:http://localhost:8000/api/v1/vision/start}
edge.vision.stop-url=${EDGE_VISION_STOP_URL:http://localhost:8000/api/v1/vision/stop}
# JWT (lee de env; usa valor por defecto solo en desarrollo)
# authorization.jwt.secret=${JWT_SECRET:WriteHereYourSecretStringForTokenSigningCredentials}
# authorization.jwt.expiration.days=${JWT_EXP_DAYS:7}

# KAFKA CONFIGURATION
spring.kafka.consumer.bootstrap-servers=pkc-56d1g.eastus.azure.confluent.cloud:9092
spring.kafka.consumer.group-id=flowtrack-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Configuración para que lea tu DTO
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.nexoralabs.flowtrack.reports.infrastructure.dto.VisionDetectionDTO

# Seguridad para conectar a Confluent Cloud
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
